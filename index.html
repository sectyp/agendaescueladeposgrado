<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agenda · Escuela de Posgrado FCA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="brand-container">
      <img src="Logo FCA Blanco.svg" alt="Logo UNCUYO Facultad de Ciencias Agrarias" class="fca-logo">
      <div class="brand-divider"></div>
      <div class="brand">
        <h1>Agenda</h1>
        <p>Escuela de Posgrado</p>
      </div>
    </div>
    <div class="headerActions">
      <button class="btn headerLogin" id="adminBtn" onclick="toggleAdminAccess()">Administrar</button>
      <div class="adminMinimal">
        <button class="newActivityBtn" onclick="openModal()"><span>＋</span><span>Nueva actividad</span></button>
      </div>
    </div>
  </header>

  <main>
    <div class="viewIntro">
      <div class="viewLabel" id="viewLabel">VISTA SEMANAL</div>
      <div class="period periodLarge" id="period"></div>
    </div>

    <div class="topbar controlsBar">
      <div class="viewNavRow">
        <div class="seg viewSeg">
          <button id="bday" onclick="setView('day')">Día</button>
          <button id="bweek" onclick="setView('week')" class="active">Semanal</button>
          <button id="bmonth" onclick="setView('month')">Mensual</button>
        </div>
        <div class="dateNav">
          <button class="btn ghost" onclick="move(-1)">←</button>
          <button class="btn ghost" onclick="goToday()">Hoy</button>
          <button class="btn ghost" onclick="move(1)">→</button>
        </div>
      </div>
      
      <div class="searchAndFilters">
        <div class="searchBox">
          <input type="text" id="searchInput" placeholder="Buscar actividad, docente..." oninput="render()">
        </div>
        <div class="filters">
          <select id="areaFilter" onchange="render()">
            <option value="">Todas las áreas</option>
            <option value="Secretaría Académica">Secretaría Académica</option>
            <option value="Secretaría de Asuntos Estudiantiles y Bienestar de la Comunidad">Estudiantes y Bienestar</option>
            <option value="Secretaría de Investigación, Internacionales y Posgrado">SIIP</option>
            <option value="Secretaría de Vinculación y Extensión">Vinculación y Extensión</option>
            <option value="Decanato">Decanato</option>
            <option value="Otro">Otro</option>
          </select>
          <select id="typeFilter" onchange="render()">
            <option value="">Todos los tipos</option>
            <option>Curso</option>
            <option>Defensa de Tesis</option>
            <option>Seminario</option>
            <option>Otro</option>
          </select>
        </div>
      </div>
    </div>

    <div class="legend">
      <span><i class="dot" style="background:#3c6fa8"></i>Académica</span>
      <span><i class="dot" style="background:#8751a5"></i>Bienestar y Estudiantes</span>
      <span><i class="dot" style="background:#007ea3"></i>SIIP</span>
      <span><i class="dot" style="background:#c4771c"></i>Vinculación</span>
      <span><i class="dot" style="background:#67823a"></i>Decanato</span>
      <span><i class="dot" style="background:#6f7780"></i>Otro</span>
    </div>
    
    <div class="publicHint" id="publicHint">Consulta pública · Actividades confirmadas.</div>
    <div class="activityCount" id="activityCount"></div>
    <section class="calendar" id="calendar"></section>
  </main>

  <!-- Modal Detalle -->
  <div class="modal" id="detail">
    <div class="panel detailPanel" id="detailPanel">
      <div class="detailBadge" id="detailBadgeContainer"><span class="detailDot"></span><span id="dareaBadge"></span></div>
      <h2 id="dtitle"></h2>
      <div id="dbody"></div>

      <!-- Desplegable y Edición para Mail (Oculto por defecto para vista pública) -->
      <div class="mailAccordion" id="mailAccordion" style="display: none;">
        <button class="mailHeaderBtn" onclick="toggleMailAccordion()">
          <span>✉️ Generar mail / plantilla</span>
          <span id="accordionArrow">▼</span>
        </button>
        <div class="mailContent" id="mailContent">
          <div class="mailTabs">
            <button class="mailTab active" id="tabConfirm" onclick="switchMailTemplate('confirm')">Confirmación</button>
            <button class="mailTab" id="tabPostpone" onclick="switchMailTemplate('postpone')">Postergación</button>
            <button class="mailTab" id="tabCancel" onclick="switchMailTemplate('cancel')">Cancelación</button>
          </div>

          <label style="font-size:11px; font-weight:800; color:var(--muted); display:block; margin-bottom:4px;">Asunto:</label>
          <input type="text" class="mailInputSubject" id="editableSubject">

          <label style="font-size:11px; font-weight:800; color:var(--muted); display:block; margin-bottom:4px;">Cuerpo del mensaje (editable):</label>
          <textarea class="mailInputBody" id="editableBody"></textarea>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:12px;">
            <button class="btn primary" style="font-size:12px; padding:8px 14px;" onclick="copyMailContent()">📋 Copiar mail</button>
            <div id="adminMailStatusBtn"></div>
          </div>
        </div>
      </div>

      <div class="actions" style="margin-top: 18px;">
        <button class="btn primary" onclick="document.getElementById('detail').classList.remove('open')">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Carga / Edición -->
  <div class="modal" id="modal">
    <div class="panel">
      <h2>Carga de Actividad</h2>
      <div class="form">
        <div class="field full">
          <label>Título</label>
          <input id="title" placeholder="Ej. Curso de Posgrado en Fisiología Vegetal">
        </div>

        <div class="field">
          <label>Tipo de actividad</label>
          <select id="type" onchange="toggleOtherTypeField()">
            <option value="Curso">Curso</option>
            <option value="Defensa de Tesis">Defensa de Tesis</option>
            <option value="Seminario">Seminario</option>
            <option value="Otro">Otro...</option>
          </select>
        </div>
        <div class="field full hidden" id="otherTypeField">
          <label>Especificar tipo de actividad</label>
          <input id="otherType" placeholder="Ej. Taller, Conferencia, Mesa Redonda...">
        </div>

        <div class="field">
          <label>Área Responsable</label>
          <select id="area" onchange="toggleOtherAreaField()">
            <option value="Secretaría Académica">Secretaría Académica</option>
            <option value="Secretaría de Asuntos Estudiantiles y Bienestar de la Comunidad">Secretaría de Asuntos Estudiantiles y Bienestar</option>
            <option value="Secretaría de Investigación, Internacionales y Posgrado">Secretaría de Investigación, Internacionales y Posgrado</option>
            <option value="Secretaría de Vinculación y Extensión">Secretaría de Vinculación y Extensión</option>
            <option value="Decanato">Decanato</option>
            <option value="Otro">Otro...</option>
          </select>
        </div>
        <div class="field full hidden" id="otherAreaField">
          <label>Especificar área responsable</label>
          <input id="otherArea" placeholder="Ej. Departamento de Matemáticas, Biblioteca...">
        </div>

        <div class="field full">
          <label>Responsable</label>
          <input id="responsible" placeholder="Nombre y apellido del docente o agente">
        </div>

        <div class="field">
          <label>Fecha de inicio</label>
          <input id="startDate" type="date">
        </div>
        <div class="field">
          <label>Fecha de finalización</label>
          <input id="endDate" type="date">
        </div>

        <div class="field">
          <label>Hora de inicio</label>
          <input id="startTime" type="time" value="10:00">
        </div>
        <div class="field">
          <label>Hora de finalización</label>
          <input id="endTime" type="time" value="12:00">
        </div>

        <div class="field">
          <label>Repetición</label>
          <select id="repeat" onchange="toggleRepeatUntilField()">
            <option value="Sin repetición">Sin repetición</option>
            <option value="Todas las semanas">Todas las semanas</option>
            <option value="15 días">Cada 15 días</option>
          </select>
        </div>
        <div class="field hidden" id="repeatUntilField">
          <label>Repetir hasta</label>
          <input id="repeatUntilDate" type="date">
        </div>

        <div class="field">
          <label>Modalidad</label>
          <select id="mode" onchange="toggleModeFields()">
            <option value="Presencial">Presencial</option>
            <option value="Híbrida">Híbrida</option>
            <option value="Virtual">Virtual</option>
          </select>
        </div>

        <div class="field" id="roomContainer">
          <label>Aula</label>
          <select id="room" onchange="toggleOtherRoomField()">
            <option value="Aula de Posgrado">Aula de Posgrado</option>
            <option value="Otra">Otra...</option>
          </select>
        </div>
        <div class="field full hidden" id="otherRoomField">
          <label>Especificar aula</label>
          <input id="otherRoom" placeholder="Ej. Aula Magna, Anfiteatro A, Laboratorio 2...">
        </div>

        <div class="field virtualField hidden" id="platformField">
          <label>Plataforma</label>
          <select id="platform">
            <option value="Google Meet">Google Meet</option>
            <option value="Microsoft Teams">Microsoft Teams</option>
            <option value="Zoom">Zoom</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
        <div class="field virtualField hidden" id="linkField">
          <label>Enlace de la sala</label>
          <input id="link" type="url" placeholder="https://...">
        </div>

        <div class="field virtualField hidden">
          <label>Visibilidad del enlace</label>
          <select id="linkPublic">
            <option value="false">Privado (solo administradores)</option>
            <option value="true">Público</option>
          </select>
        </div>

        <div class="field virtualField hidden">
          <label>Cuenta utilizada</label>
          <input id="account" placeholder="Ej. posgrado@fca.uncu.edu.ar">
        </div>

        <div class="field full">
          <label>Enlace para más información</label>
          <input id="infoLink" type="url" placeholder="https://fca.uncuyo.edu.ar/...">
        </div>

        <div class="field full">
          <label>Observaciones</label>
          <textarea id="notes" rows="3" placeholder="Detalles adicionales..."></textarea>
        </div>

        <div class="field" id="recordingField">
          <label>Requiere grabación</label>
          <select id="needsRecording">
            <option value="No">No</option>
            <option value="Sí">Sí</option>
          </select>
        </div>

        <div class="field">
          <label>Estado</label>
          <select id="status">
            <option value="Confirmado">Confirmado</option>
            <option value="A confirmar">A confirmar</option>
            <option value="Cancelado">Cancelado</option>
            <option value="Postergado">Postergado</option>
          </select>
        </div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="closeModal()">Cancelar</button>
        <button class="btn primary" id="saveActivityBtn" onclick="saveEvent()">Guardar registro</button>
      </div>
    </div>
  </div>

  <!-- Modal Login Admin Real con Firebase -->
  <div class="modal" id="loginModal">
    <div class="panel" style="width:min(440px,100%)">
      <h2>Acceso de administración</h2>
      <div class="field" style="margin-top:14px">
        <label>Correo Institucional</label>
        <input id="adminEmail" type="email" placeholder="posgrado@fca.uncu.edu.ar">
      </div>
      <div class="field" style="margin-top:10px">
        <label>Contraseña</label>
        <input id="adminPassword" type="password" placeholder="••••••••">
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="document.getElementById('loginModal').classList.remove('open')">Cancelar</button>
        <button class="btn primary" onclick="loginAdminReal()">Ingresar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
